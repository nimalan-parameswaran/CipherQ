# ==============================================================================
# CipherQ Nginx Reverse Proxy Configuration
# Target: Debian 12 (Bookworm) / Arduino UNO Q
#
# CRITICAL ARCHITECTURAL CONSTRAINTS:
# 1. proxy_request_buffering OFF: Uploads stream directly to FastAPI without
#    buffering 5GB payloads to /var/lib/nginx on 32GB eMMC storage.
# 2. proxy_buffering OFF: Decryption streams directly to client chunks without
#    intermediate disk/memory buffering.
# 3. HTTPS Required for LAN Access: Unencrypted HTTP transmits session cookies
#    and plaintext credentials in cleartext over the local network.
# ==============================================================================

upstream cipherq_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect all plain HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cipherq.local _;

    # Block public IP scanning or return permanent redirect to TLS
    return 301 https://$host$request_uri;
}

# HTTPS Primary Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cipherq.local localhost;

    # --------------------------------------------------------------------------
    # TLS Certificate Configuration
    # Options:
    # 1. mkcert (Recommended for local LAN development):
    #    mkcert -install && mkcert cipherq.local 192.168.1.xxx localhost 127.0.0.1
    # 2. Tailscale TLS (Recommended for secure remote mesh access):
    #    tailscale cert <node-name>.ts.net
    # 3. Let's Encrypt / Certbot (if registered with a public DNS record)
    # --------------------------------------------------------------------------
    ssl_certificate /etc/ssl/certs/cipherq.crt;
    ssl_certificate_key /etc/ssl/private/cipherq.key;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # Storage and Streaming Quota Settings
    # Enforces 5GB maximum upload matching the Premium storage tier.
    # --------------------------------------------------------------------------
    client_max_body_size 5000M;
    client_body_buffer_size 1M;
    client_body_timeout 1800s;

    # --------------------------------------------------------------------------
    # Defensive Security Headers
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self';" always;

    # Logging
    access_log /var/log/nginx/cipherq_access.log;
    error_log /var/log/nginx/cipherq_error.log warn;

    # --------------------------------------------------------------------------
    # Reverse Proxy to Uvicorn / FastAPI
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://cipherq_backend;
        proxy_http_version 1.1;

        # Mandatory Streaming AEAD Configuration:
        # Prevents Nginx from storing 5GB temporary upload chunks on eMMC
        proxy_request_buffering off;
        proxy_buffering off;

        # Connection handling
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Transfer Timeouts for Large Vault Transfers
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
