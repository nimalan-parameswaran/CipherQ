<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CipherQ</title>
  <!--
    GitHub Pages 404 SPA Redirect
    ==============================
    GitHub Pages only serves pre-rendered files. Any direct navigation to
    a CipherQ URL (e.g. /dashboard.html) works fine because these are real
    files. This 404 page handles any other unexpected paths gracefully by
    redirecting back to the landing page.

    If you later add client-side routing, the standard SPA redirect trick
    (encoding the path in the query string) can be implemented here instead.
  -->
  <meta http-equiv="refresh" content="0; url=index.html">
  <link rel="canonical" href="index.html">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #0e1117; color: #e2e8f0; font-family: system-ui, sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .msg { text-align: center; max-width: 480px; width: 100%; padding: 20px; overflow-wrap: break-word; }
    .msg h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    .msg p { color: #94a3b8; font-size: 0.9rem; line-height: 1.5; }
    .msg a { color: #10b981; text-decoration: none; }
  </style>
</head>
<body>
  <div class="msg">
    <h1>Redirecting…</h1>
    <p>If you are not redirected automatically, <a href="index.html">return to CipherQ</a>.</p>
  </div>
</body>
</html>
