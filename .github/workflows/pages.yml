name: Deploy CipherQ frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage frontend-only site
        env:
          CIPHERQ_API_BASE_URL: ${{ vars.CIPHERQ_API_BASE_URL }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R frontend/. _site/
          if [ -n "$CIPHERQ_API_BASE_URL" ]; then
            printf '%s\n' \
              '/** Generated by GitHub Actions from the public repository variable. */' \
              "window.CIPHERQ_API_BASE_URL = \"${CIPHERQ_API_BASE_URL%/}\";" \
              > _site/js/config.js
          fi
          find _site -type f \( -name '*.bak' -o -name '*.pre-public.bak' -o -name '*.pre-*.bak' \) -delete
          rm -f _site/js/mock-data.js
          find _site -type f \( -name '.env' -o -name '.env.*' -o -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pem' -o -name '*.key' -o -name '*.log' \) -delete


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
